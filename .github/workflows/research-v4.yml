
name: RLA V4 Research Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile research_v4.py

      - name: Run V4 Research Engine
        env:
          SYMBOL: "GC=F"
          INTERVAL: "5m"
          PERIOD: "60d"
        run: python research_v4.py

      - name: Upload V4 Research Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RLA-V4-Research-Reports
          path: research_v4_output/
          if-no-files-found: warn
          retention-days: 30
