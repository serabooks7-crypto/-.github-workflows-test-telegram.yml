name: RLA V3 Research Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V3 Research Engine
        run: |
          python research_v3.py

      - name: Upload V3 Research Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RLA-V3-Research-Reports
          path: research_v3_output/
          if-no-files-found: warn
          retention-days: 30
