
name: PK BOT V6.4 - Full Data Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install yfinance pandas numpy

      - name: Validate 14 Instruments
        run: |
          python - <<'PY'
          import yfinance as yf
          import pandas as pd
          import numpy as np

          SYMBOLS = {
              "EURUSD": "EURUSD=X",
              "GBPUSD": "GBPUSD=X",
              "USDJPY": "JPY=X",
              "USDCHF": "CHF=X",
              "USDCAD": "CAD=X",
              "AUDUSD": "AUDUSD=X",
              "NZDUSD": "NZDUSD=X",
              "EURJPY": "EURJPY=X",
              "GBPJPY": "GBPJPY=X",
              "EURGBP": "EURGBP=X",
              "EURCHF": "EURCHF=X",
              "AUDJPY": "AUDJPY=X",
              "XAUUSD": "GC=F",
              "AUDCAD": "AUDCAD=X"
          }

          PERIODS = {
              "15m": "30d",
              "30m": "60d",
              "1h": "730d",
              "1d": "5y"
          }

          REQUIRED = ["Open", "High", "Low", "Close"]

          def extract(data, ticker):
              if data is None or data.empty:
                  return pd.DataFrame()

              if isinstance(data.columns, pd.MultiIndex):
                  for level in [0, 1]:
                      if ticker in data.columns.get_level_values(level):
                          return data.xs(
                              ticker, axis=1, level=level
                          ).copy()

                  return pd.DataFrame()

              return data.copy()

          def validate_ohlc(df):
              if df.empty:
                  return False, "No data"

              if not all(c in df.columns for c in REQUIRED):
                  return False, "Missing OHLC columns"

              df = df.dropna(subset=REQUIRED)

              if df.empty:
                  return False, "No valid OHLC rows"

              if (df["High"] < df["Low"]).any():
                  return False, "Invalid High/Low"

              if (df["High"] < df["Open"]).any():
                  return False, "Invalid High/Open"

              if (df["High"] < df["Close"]).any():
                  return False, "Invalid High/Close"

              if (df["Low"] > df["Open"]).any():
                  return False, "Invalid Low/Open"

              if (df["Low"] > df["Close"]).any():
                  return False, "Invalid Low/Close"

              return True, "OHLC valid"

          def resample_ohlc(df, hours):
              df = df.dropna(subset=REQUIRED).copy()
              df = df.sort_index()

              rule = f"{hours}h"

              aggregation = {
                  "Open": "first",
                  "High": "max",
                  "Low": "min",
                  "Close": "last"
              }

              if "Volume" in df.columns:
                  aggregation["Volume"] = "sum"

              grouped = df.resample(
                  rule,
                  origin="start_day",
                  label="left",
                  closed="left"
              )

              result = grouped.agg(aggregation)
              counts = grouped["Close"].count()

              result = result[counts == hours]
              result = result.dropna(subset=REQUIRED)

              return result

          print("PK BOT V6.4 - FULL DATA VALIDATION")
          print("Active instruments:", len(SYMBOLS))
          print("XAGUSD excluded")
          print("=" * 60)

          results = {}

          for interval, period in PERIODS.items():
              print(f"\nTIMEFRAME: {interval} | Period: {period}")

              tickers = list(SYMBOLS.values())

              try:
                  data = yf.download(
                      tickers=tickers,
                      period=period,
                      interval=interval,
                      group_by="ticker",
                      threads=False,
                      progress=False,
                      timeout=40,
                      auto_adjust=False,
                      prepost=False
                  )
              except Exception as e:
                  print("DOWNLOAD ERROR:", str(e))
                  data = pd.DataFrame()

              for name, ticker in SYMBOLS.items():
                  df = extract(data, ticker)

                  if df.empty:
                      print(f"FAIL: {name} | {interval} | No data")
                      results[(name, interval)] = False
                      continue

                  df = df.sort_index()

                  duplicate_count = int(df.index.duplicated().sum())
                  valid, reason = validate_ohlc(df)

                  if not valid:
                      print(f"FAIL: {name} | {interval} | {reason}")
                      results[(name, interval)] = False
                      continue

                  df = df.dropna(subset=REQUIRED)

                  print(
                      f"PASS: {name} | {interval} | "
                      f"Candles: {len(df)} | "
                      f"Duplicates: {duplicate_count} | "
                      f"Latest Close: {df['Close'].iloc[-1]}"
                  )

                  results[(name, interval)] = True

          print("\n" + "=" * 60)
          print("RESAMPLING TEST: 1H -> 2H AND 4H")

          for name, ticker in SYMBOLS.items():
              try:
                  data = yf.download(
                      tickers=[ticker],
                      period="730d",
                      interval="1h",
                      threads=False,
                      progress=False,
                      timeout=40,
                      auto_adjust=False
                  )

                  df = extract(data, ticker)

                  for hours in [2, 4]:
                      resampled = resample_ohlc(df, hours)
                      valid, reason = validate_ohlc(resampled)

                      if valid and len(resampled) > 0:
                          print(
                              f"PASS: {name} | {hours}H | "
                              f"Candles: {len(resampled)} | "
                              f"Latest Close: "
                              f"{resampled['Close'].iloc[-1]}"
                          )
                      else:
                          print(
                              f"FAIL: {name} | {hours}H | {reason}"
                          )

              except Exception as e:
                  print(f"FAIL: {name} | Resampling | {e}")

          print("\n" + "=" * 60)
          passed = sum(results.values())
          total = len(results)

          print(f"BASE DATA RESULT: {passed}/{total} PASSED")

          print("\nHISTORY CHECK:")
          print("15M: 30-day request")
          print("30M: 60-day request")
          print("1H: 730-day request")
          print("1D: 5-year request")

          print("\nVALIDATION COMPLETE")
          PY
