
name: PK BOT V6.4 - Full Data Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: pip install yfinance pandas numpy

      - name: Validate 14 Instruments and 5 Timeframes
        run: |
          python - <<'PY'
          import sys
          import yfinance as yf
          import pandas as pd

          SYMBOLS = {
              "EURUSD": "EURUSD=X",
              "GBPUSD": "GBPUSD=X",
              "USDJPY": "JPY=X",
              "USDCHF": "CHF=X",
              "USDCAD": "CAD=X",
              "AUDUSD": "AUDUSD=X",
              "NZDUSD": "NZDUSD=X",
              "EURJPY": "EURJPY=X",
              "GBPJPY": "GBPJPY=X",
              "EURGBP": "EURGBP=X",
              "EURCHF": "EURCHF=X",
              "AUDJPY": "AUDJPY=X",
              "XAUUSD": "GC=F",
              "AUDCAD": "AUDCAD=X"
          }

          PERIODS = {
              "15m": "30d",
              "30m": "60d",
              "1h": "730d"
          }

          REQUIRED = ["Open", "High", "Low", "Close"]

          failures = []
          base_pass = 0
          base_total = len(SYMBOLS) * len(PERIODS)
          resample_pass = 0
          resample_total = len(SYMBOLS) * 2

          hourly_data = {}

          def extract(data, ticker):
              if data is None or data.empty:
                  return pd.DataFrame()

              if isinstance(data.columns, pd.MultiIndex):
                  for level in range(data.columns.nlevels):
                      if ticker in data.columns.get_level_values(level):
                          try:
                              result = data.xs(
                                  ticker,
                                  axis=1,
                                  level=level
                              )
                              if isinstance(result.columns, pd.MultiIndex):
                                  result.columns = result.columns.get_level_values(0)
                              return result.copy()
                          except Exception:
                              pass

                  return pd.DataFrame()

              return data.copy()

          def remove_open_candles(df, minutes):
              if df.empty:
                  return df

              df = df.copy()

              if df.index.tz is None:
                  df.index = df.index.tz_localize("UTC")
              else:
                  df.index = df.index.tz_convert("UTC")

              now = pd.Timestamp.now(tz="UTC")
              candle_close_time = df.index + pd.Timedelta(minutes=minutes)

              return df.loc[candle_close_time <= now].copy()

          def validate_ohlc(df):
              if df is None or df.empty:
                  return False, "No data"

              if not all(c in df.columns for c in REQUIRED):
                  return False, "Missing OHLC columns"

              df = df.copy()

              for col in REQUIRED:
                  df[col] = pd.to_numeric(
                      df[col],
                      errors="coerce"
                  )

              df = df.dropna(subset=REQUIRED)

              if df.empty:
                  return False, "No valid OHLC rows"

              invalid = (
                  (df["High"] < df["Low"]) |
                  (df["High"] < df["Open"]) |
                  (df["High"] < df["Close"]) |
                  (df["Low"] > df["Open"]) |
                  (df["Low"] > df["Close"])
              )

              if invalid.any():
                  return False, f"Invalid OHLC rows: {int(invalid.sum())}"

              if (df[REQUIRED] <= 0).any().any():
                  return False, "Non-positive price found"

              return True, "OHLC valid"

          def resample_ohlc(df, hours):
              if df.empty:
                  return pd.DataFrame()

              df = df.copy()
              df = df.sort_index()
              df = df[~df.index.duplicated(keep="last")]
              df = df.dropna(subset=REQUIRED)

              rule = f"{hours}h"

              aggregation = {
                  "Open": "first",
                  "High": "max",
                  "Low": "min",
                  "Close": "last"
              }

              if "Volume" in df.columns:
                  aggregation["Volume"] = "sum"

              grouped = df.resample(
                  rule,
                  origin="start_day",
                  label="left",
                  closed="left"
              )

              result = grouped.agg(aggregation)
              counts = grouped["Close"].count()

              # Keep only complete 2H or 4H candles.
              result = result[counts == hours]

              result = result.dropna(subset=REQUIRED)

              return result

          print("=" * 65)
          print("PK BOT V6.4 - FULL DATA VALIDATION")
          print("Active instruments:", len(SYMBOLS))
          print("Excluded: XAGUSD and 1D")
          print("Direct timeframes: 15M, 30M, 1H")
          print("Resampled timeframes: 2H, 4H")
          print("=" * 65)

          # --------------------------------------------------
          # PART 1: DIRECT DATA VALIDATION
          # --------------------------------------------------

          for interval, period in PERIODS.items():

              print(f"\nTIMEFRAME: {interval} | Period: {period}")

              tickers = list(SYMBOLS.values())

              try:
                  data = yf.download(
                      tickers=tickers,
                      period=period,
                      interval=interval,
                      group_by="ticker",
                      threads=False,
                      progress=False,
                      timeout=40,
                      auto_adjust=False,
                      prepost=False
                  )
              except Exception as e:
                  print("DOWNLOAD ERROR:", str(e))
                  data = pd.DataFrame()

              for name, ticker in SYMBOLS.items():

                  df = extract(data, ticker)

                  if df.empty:
                      message = f"FAIL: {name} | {interval} | No data"
                      print(message)
                      failures.append(message)
                      continue

                  minutes = {
                      "15m": 15,
                      "30m": 30,
                      "1h": 60
                  }[interval]

                  df = remove_open_candles(df, minutes)
                  df = df.sort_index()

                  duplicates = int(df.index.duplicated().sum())

                  df = df[~df.index.duplicated(keep="last")]

                  valid, reason = validate_ohlc(df)

                  if not valid:
                      message = f"FAIL: {name} | {interval} | {reason}"
                      print(message)
                      failures.append(message)
                      continue

                  print(
                      f"PASS: {name} | {interval} | "
                      f"Candles: {len(df)} | "
                      f"Duplicates: {duplicates} | "
                      f"Latest Close: {df['Close'].iloc[-1]}"
                  )

                  base_pass += 1

                  if interval == "1h":
                      hourly_data[name] = df

          # --------------------------------------------------
          # PART 2: RESAMPLING 1H TO 2H AND 4H
          # --------------------------------------------------

          print("\n" + "=" * 65)
          print("RESAMPLING TEST: 1H -> 2H AND 4H")
          print("Only complete, closed candles are accepted.")
          print("=" * 65)

          for name in SYMBOLS:

              df = hourly_data.get(name, pd.DataFrame())

              if df.empty:
                  for hours in [2, 4]:
                      message = (
                          f"FAIL: {name} | {hours}H | "
                          "Missing 1H source data"
                      )
                      print(message)
                      failures.append(message)
                  continue

              for hours in [2, 4]:

                  resampled = resample_ohlc(df, hours)

                  valid, reason = validate_ohlc(resampled)

                  if not valid or len(resampled) < 100:
                      message = (
                          f"FAIL: {name} | {hours}H | "
                          f"{reason} | Candles: {len(resampled)}"
                      )
                      print(message)
                      failures.append(message)
                      continue

                  print(
                      f"PASS: {name} | {hours}H | "
                      f"Candles: {len(resampled)} | "
                      f"Latest Close: {resampled['Close'].iloc[-1]}"
                  )

                  resample_pass += 1

          # --------------------------------------------------
          # PART 3: FINAL REPORT
          # --------------------------------------------------

          print("\n" + "=" * 65)
          print("FINAL VALIDATION REPORT")
          print("=" * 65)

          print(
              f"BASE DATA RESULT: {base_pass}/{base_total} PASSED"
          )

          print(
              f"RESAMPLING RESULT: {resample_pass}/{resample_total} PASSED"
          )

          total_pass = base_pass + resample_pass
          total_tests = base_total + resample_total

          print(
              f"OVERALL RESULT: {total_pass}/{total_tests} PASSED"
          )

          print("\nACTIVE TIMEFRAMES:")
          print("15M: Direct Yahoo Finance")
          print("30M: Direct Yahoo Finance")
          print("1H: Direct Yahoo Finance")
          print("2H: Resampled from 1H")
          print("4H: Resampled from 1H")
          print("1D: EXCLUDED")

          print("\nGOLD DATA WARNING:")
          print("XAUUSD uses GC=F Gold Futures as a proxy.")
          print("It is not identical to broker XAUUSD spot data.")

          if failures:
              print("\nFAILED TESTS:")
              for item in failures:
                  print(item)

              print("\nVALIDATION STATUS: FAILED")
              sys.exit(1)

          print("\nVALIDATION STATUS: ALL TESTS PASSED")
          print("PK BOT V6.4 DATA VALIDATION COMPLETE")

          PY
