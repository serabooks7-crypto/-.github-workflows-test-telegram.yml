
name: PK BOT V6.4 - Data Integrity Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: pip install yfinance pandas numpy

      - name: Validate Data Integrity
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          import pandas as pd
          import yfinance as yf

          SYMBOLS = {
              "EURUSD": "EURUSD=X",
              "GBPUSD": "GBPUSD=X",
              "USDJPY": "JPY=X",
              "USDCHF": "CHF=X",
              "USDCAD": "CAD=X",
              "AUDUSD": "AUDUSD=X",
              "NZDUSD": "NZDUSD=X",
              "EURJPY": "EURJPY=X",
              "GBPJPY": "GBPJPY=X",
              "EURGBP": "EURGBP=X",
              "EURCHF": "EURCHF=X",
              "AUDJPY": "AUDJPY=X",
              "XAUUSD": "GC=F",
              "AUDCAD": "AUDCAD=X"
          }

          PERIODS = {
              "15m": "30d",
              "30m": "60d",
              "1h": "730d"
          }

          MINIMUM = {
              "15m": 100,
              "30m": 100,
              "1h": 500,
              "2h": 100,
              "4h": 100
          }

          REQUIRED = ["Open", "High", "Low", "Close"]

          failures = []
          base_pass = 0
          resample_pass = 0
          hourly_data = {}

          def extract(data, ticker):
              if data is None or data.empty:
                  return pd.DataFrame()

              if isinstance(data.columns, pd.MultiIndex):
                  for level in range(data.columns.nlevels):
                      if ticker in data.columns.get_level_values(level):
                          try:
                              out = data.xs(
                                  ticker,
                                  axis=1,
                                  level=level
                              ).copy()

                              if isinstance(out.columns, pd.MultiIndex):
                                  out.columns = out.columns.get_level_values(0)

                              return out
                          except Exception:
                              pass

                  return pd.DataFrame()

              return data.copy()

          def clean_data(df, minutes):
              if df.empty:
                  return pd.DataFrame()

              df = df.copy()

              if df.index.tz is None:
                  df.index = df.index.tz_localize("UTC")
              else:
                  df.index = df.index.tz_convert("UTC")

              df = df.sort_index()
              df = df[~df.index.duplicated(keep="last")]

              for col in REQUIRED:
                  if col not in df.columns:
                      return pd.DataFrame()

                  df[col] = pd.to_numeric(
                      df[col],
                      errors="coerce"
                  )

              # Remove rows with missing or infinite OHLC values.
              df = df.replace([np.inf, -np.inf], np.nan)
              df = df.dropna(subset=REQUIRED)

              # Keep only fully closed candles.
              now = pd.Timestamp.now(tz="UTC")
              close_time = df.index + pd.Timedelta(minutes=minutes)
              df = df.loc[close_time <= now].copy()

              return df

          def validate_data(df, timeframe):
              if df.empty:
                  return False, "No valid candles"

              if len(df) < MINIMUM[timeframe]:
                  return False, f"Insufficient candles: {len(df)}"

              values = df[REQUIRED].to_numpy(dtype=float)

              if not np.isfinite(values).all():
                  return False, "NaN or infinite OHLC remains"

              invalid = (
                  (df["High"] < df["Low"]) |
                  (df["High"] < df["Open"]) |
                  (df["High"] < df["Close"]) |
                  (df["Low"] > df["Open"]) |
                  (df["Low"] > df["Close"]) |
                  (df[REQUIRED] <= 0).any(axis=1)
              )

              if invalid.any():
                  return False, f"Invalid OHLC rows: {int(invalid.sum())}"

              latest_close = float(df["Close"].iloc[-1])

              if not np.isfinite(latest_close) or latest_close <= 0:
                  return False, "Invalid latest Close"

              return True, "Valid"

          def resample_complete(df, hours):
              if df.empty:
                  return pd.DataFrame()

              df = df.sort_index()
              rule = f"{hours}h"

              aggregation = {
                  "Open": "first",
                  "High": "max",
                  "Low": "min",
                  "Close": "last"
              }

              if "Volume" in df.columns:
                  aggregation["Volume"] = "sum"

              now = pd.Timestamp.now(tz="UTC")
              output = []

              for start, group in df.groupby(
                  pd.Grouper(
                      freq=rule,
                      origin="start_day",
                      label="left",
                      closed="left"
                  )
              ):
                  if group.empty:
                      continue

                  # A complete candle needs every consecutive 1H bar.
                  expected = pd.date_range(
                      start=start,
                      periods=hours,
                      freq="1h"
                  )

                  if not group.index.equals(expected):
                      continue

                  if start + pd.Timedelta(hours=hours) > now:
                      continue

                  row = {
                      "Open": group["Open"].iloc[0],
                      "High": group["High"].max(),
                      "Low": group["Low"].min(),
                      "Close": group["Close"].iloc[-1]
                  }

                  if "Volume" in group.columns:
                      row["Volume"] = group["Volume"].sum()

                  output.append((start, row))

              if not output:
                  return pd.DataFrame()

              result = pd.DataFrame(
                  [item[1] for item in output],
                  index=[item[0] for item in output]
              )

              return result

          print("=" * 65)
          print("PK BOT V6.4 - DATA INTEGRITY VALIDATION")
          print("Instruments:", len(SYMBOLS))
          print("1D: EXCLUDED")
          print("Direct: 15M, 30M, 1H")
          print("Resampled: 2H, 4H")
          print("=" * 65)

          # Direct timeframe tests
          for interval, period in PERIODS.items():

              print(f"\nTIMEFRAME: {interval}")

              try:
                  data = yf.download(
                      tickers=list(SYMBOLS.values()),
                      period=period,
                      interval=interval,
                      group_by="ticker",
                      threads=False,
                      progress=False,
                      timeout=40,
                      auto_adjust=False,
                      prepost=False
                  )
              except Exception as e:
                  print("DOWNLOAD ERROR:", str(e))
                  data = pd.DataFrame()

              minutes = {
                  "15m": 15,
                  "30m": 30,
                  "1h": 60
              }[interval]

              for name, ticker in SYMBOLS.items():

                  df = extract(data, ticker)
                  df = clean_data(df, minutes)

                  valid, reason = validate_data(df, interval)

                  if not valid:
                      message = f"FAIL: {name} | {interval} | {reason}"
                      print(message)
                      failures.append(message)
                      continue

                  latest = float(df["Close"].iloc[-1])

                  print(
                      f"PASS: {name} | {interval} | "
                      f"Candles: {len(df)} | "
                      f"Latest Close: {latest}"
                  )

                  base_pass += 1

                  if interval == "1h":
                      hourly_data[name] = df

          # Resampling tests
          print("\n" + "=" * 65)
          print("RESAMPLING: 1H -> 2H AND 4H")
          print("=" * 65)

          for name in SYMBOLS:

              source = hourly_data.get(name, pd.DataFrame())

              for hours in [2, 4]:

                  if source.empty:
                      result = pd.DataFrame()
                  else:
                      result = resample_complete(source, hours)

                  timeframe = f"{hours}h"
                  valid, reason = validate_data(result, timeframe)

                  if not valid:
                      message = (
                          f"FAIL: {name} | {timeframe} | {reason}"
                      )
                      print(message)
                      failures.append(message)
                      continue

                  latest = float(result["Close"].iloc[-1])

                  print(
                      f"PASS: {name} | {timeframe} | "
                      f"Candles: {len(result)} | "
                      f"Latest Close: {latest}"
                  )

                  resample_pass += 1

          # Final report
          base_total = len(SYMBOLS) * len(PERIODS)
          resample_total = len(SYMBOLS) * 2

          print("\n" + "=" * 65)
          print("FINAL DATA INTEGRITY REPORT")
          print("=" * 65)

          print(f"BASE DATA: {base_pass}/{base_total}")
          print(f"RESAMPLING: {resample_pass}/{resample_total}")
          print(
              f"OVERALL: {base_pass + resample_pass}/"
              f"{base_total + resample_total}"
          )

          print("\nTIMEFRAMES:")
          print("15M: Direct")
          print("30M: Direct")
          print("1H: Direct")
          print("2H: Complete 1H candles")
          print("4H: Complete 1H candles")
          print("1D: EXCLUDED")

          print("\nGOLD WARNING: GC=F is a futures proxy, not broker spot XAUUSD.")

          if failures:
              print("\nFAILED TESTS:")
              for item in failures:
                  print(item)

              print("\nSTATUS: FAILED")
              sys.exit(1)

          print("\nSTATUS: ALL DATA INTEGRITY TESTS PASSED")

          PY
