
name: PK V6.1 - 90 Day Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    name: Run PK V6.1 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pk_v6_requirements.txt

      - name: Run Backtest
        run: python pk_v6_backtest.py

      - name: Upload Backtest Reports
        uses: actions/upload-artifact@v4
        with:
          name: PK-V6.1-Backtest-Results
          path: backtest_results/*.csv
          if-no-files-found: error
          retention-days: 30
